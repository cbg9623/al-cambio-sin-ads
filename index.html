<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparador Cambiario VE</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    h2 { text-align: center; font-size: 1.3rem; color: #38bdf8; margin-bottom: 16px; }
    
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; }
    label { font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .grid-rates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    input { width: 100%; padding: 12px; font-size: 1.1rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-weight: bold; outline: none; }
    input:focus { border-color: #38bdf8; }

    .result-box { display: flex; justify-content: space-between; align-items: center; }
    .val { font-size: 1.3rem; font-weight: bold; }
    .val-bcv { color: #38bdf8; }
    .val-usdt { color: #facc15; }
    .val-loss { color: #f87171; }
    .subtext { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
    
    .loss-card { border: 1px solid #ef4444; background: rgba(239, 68, 68, 0.08); }
    
    .btn-sync { width: 100%; background: #0284c7; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .btn-sync:active { background: #0369a1; }

    .status-tag { font-size: 0.8rem; text-align: center; color: #38bdf8; margin-top: 10px; font-weight: 500; }
  </style>
</head>
<body>

<div class="container">
  <h2>Comparador Cambiario VE</h2>

  <!-- Monto en Bolívares -->
  <div class="card">
    <label for="montoBs">Monto en Bolívares (Bs.)</label>
    <input type="number" id="montoBs" placeholder="Ej: 202000" step="any" oninput="calcular()" onchange="calcular()">
  </div>

  <!-- Tasas de Cambio -->
  <div class="card">
    <div class="grid-rates">
      <div>
        <label for="tasaBCVInput">Tasa BCV (Bs/$)</label>
        <input type="number" id="tasaBCVInput" placeholder="0.00" step="any" oninput="guardarYCalcular()" onchange="guardarYCalcular()">
      </div>
      <div>
        <label for="tasaUSDTInput">Tasa USDT (Bs/$)</label>
        <input type="number" id="tasaUSDTInput" placeholder="0.00" step="any" oninput="guardarYCalcular()" onchange="guardarYCalcular()">
      </div>
    </div>
  </div>

  <!-- Resultado BCV -->
  <div class="card">
    <div class="result-box">
      <div>
        <label>Equivalente en BCV</label>
        <div class="subtext">Tasa oficial</div>
      </div>
      <div class="val val-bcv" id="resBCV">$0,00</div>
    </div>
  </div>

  <!-- Resultado USDT -->
  <div class="card">
    <div class="result-box">
      <div>
        <label>Equivalente en USDT (P2P)</label>
        <div class="subtext">Tasa mercado</div>
      </div>
      <div class="val val-usdt" id="resUSDT">$0,00</div>
    </div>
  </div>

  <!-- Pérdida por Brecha -->
  <div class="card loss-card">
    <label style="color: #fca5a5;">Pérdida por Brecha Cambiaria</label>
    <div class="val val-loss" id="resLoss">-$0,00</div>
    <div class="subtext" id="resLossBs" style="color: #f87171; font-weight: 600;">Diferencia: 0,00 Bs.</div>
  </div>

  <button class="btn-sync" onclick="buscarTasasAuto()">🔄 Actualizar Tasas Online</button>
  <div class="status-tag" id="statusMsg">Cargando aplicación...</div>
</div>

<script>
  const fmt = new Intl.NumberFormat('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function calcular() {
    // Lectura directa de las casillas en la interfaz
    const bs = parseFloat(document.getElementById('montoBs').value) || 0;
    const bcv = parseFloat(document.getElementById('tasaBCVInput').value) || 0;
    const usdt = parseFloat(document.getElementById('tasaUSDTInput').value) || 0;

    if (bcv <= 0 || usdt <= 0 || bs <= 0) {
      document.getElementById('resBCV').innerText = '$0,00';
      document.getElementById('resUSDT').innerText = '$0,00';
      document.getElementById('resLoss').innerText = '-$0,00';
      document.getElementById('resLossBs').innerText = 'Diferencia: 0,00 Bs.';
      return;
    }

    const usdBCV = bs / bcv;
    const usdUSDT = bs / usdt;
    const perdidaUSD = usdBCV - usdUSDT;
    const perdidaBS = perdidaUSD * usdt;

    document.getElementById('resBCV').innerText = `$${fmt.format(usdBCV)}`;
    document.getElementById('resUSDT').innerText = `$${fmt.format(usdUSDT)}`;
    document.getElementById('resLoss').innerText = `-$${fmt.format(perdidaUSD)}`;
    document.getElementById('resLossBs').innerText = `Diferencia: -${fmt.format(perdidaBS)} Bs.`;
  }

  function guardarYCalcular() {
    const bcv = parseFloat(document.getElementById('tasaBCVInput').value) || 0;
    const usdt = parseFloat(document.getElementById('tasaUSDTInput').value) || 0;

    if (bcv > 0) localStorage.setItem('tasa_bcv', bcv);
    if (usdt > 0) localStorage.setItem('tasa_usdt', usdt);

    document.getElementById('statusMsg').innerText = 'Modo manual activo';
    document.getElementById('statusMsg').style.color = '#facc15';
    calcular();
  }

  async function fetchConTimeout(url, timeoutMs = 2500) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(id);
      if (!res.ok) throw new Error('Error de red');
      return res;
    } catch (e) {
      clearTimeout(id);
      throw e;
    }
  }

  async function buscarTasasAuto() {
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.innerText = 'Buscando tasas online...';
    statusMsg.style.color = '#38bdf8';

    const targetUrl = 'https://ve.dolarapi.com/v1/dolares';

    const pDirecta = fetchConTimeout(targetUrl).then(r => r.json());
    const pProxy1 = fetchConTimeout('https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl))
      .then(r => r.json())
      .then(json => JSON.parse(json.contents));
    const pProxy2 = fetchConTimeout('https://corsproxy.io/?' + encodeURIComponent(targetUrl))
      .then(r => r.json());

    try {
      const data = await Promise.any([pDirecta, pProxy1, pProxy2]);

      if (Array.isArray(data)) {
        const oficial = data.find(d => d.codigo === 'oficial');
        const paralelo = data.find(d => d.codigo === 'paralelo');

        if (oficial) document.getElementById('tasaBCVInput').value = oficial.promedio;
        if (paralelo) document.getElementById('tasaUSDTInput').value = paralelo.promedio;

        guardarYCalcular();

        const hora = new Date().toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' });
        statusMsg.innerText = `Tasas actualizadas (${hora})`;
        statusMsg.style.color = '#4ade80';
      }
    } catch (e) {
      const bcvGuardado = parseFloat(localStorage.getItem('tasa_bcv')) || 0;
      const usdtGuardado = parseFloat(localStorage.getItem('tasa_usdt')) || 0;

      if (bcvGuardado > 0) document.getElementById('tasaBCVInput').value = bcvGuardado;
      if (usdtGuardado > 0) document.getElementById('tasaUSDTInput').value = usdtGuardado;

      calcular();

      if (bcvGuardado > 0 && usdtGuardado > 0) {
        statusMsg.innerText = 'Usando tasas guardadas anteriormente';
        statusMsg.style.color = '#facc15';
      } else {
        statusMsg.innerText = 'Escribe las tasas manualmente';
        statusMsg.style.color = '#f87171';
      }
    }
  }

  window.onload = function() {
    // Cargar tasas guardadas en localStorage si existen
    const bcvGuardado = localStorage.getItem('tasa_bcv');
    const usdtGuardado = localStorage.getItem('tasa_usdt');

    if (bcvGuardado) document.getElementById('tasaBCVInput').value = bcvGuardado;
    if (usdtGuardado) document.getElementById('tasaUSDTInput').value = usdtGuardado;

    calcular();
    buscarTasasAuto();
    setInterval(buscarTasasAuto, 300000);
  };
</script>

</body>
</html>
